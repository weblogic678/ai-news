services:
  anythingllm:
    image: mintplexlabs/anythingllm:1.17.0@sha256:f26f30df46916b6e953e3a47ca98f48817726e3df635e62d4bfdd133292ecfff
    platform: linux/amd64
    restart: unless-stopped
    ports:
    - 127.0.0.1:3001:3001
    environment:
      STORAGE_DIR: /app/server/storage
    volumes:
    - app-data:/app/server/storage
    - ./app.env:/app/server/.env
    depends_on:
      init-data:
        condition: service_completed_successfully
  init-data:
    image: mintplexlabs/anythingllm:1.17.0@sha256:f26f30df46916b6e953e3a47ca98f48817726e3df635e62d4bfdd133292ecfff
    platform: linux/amd64
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - mkdir -p /app/server/storage; test -f /app/server/storage/.env || touch /app/server/storage/.env;
      chown -R 1000:1000 /app/server/storage; chown 1000:1000 /config.env; chmod 600
      /config.env
    volumes:
    - app-data:/app/server/storage
    - ./app.env:/config.env
    restart: 'no'
volumes:
  app-data: {}
