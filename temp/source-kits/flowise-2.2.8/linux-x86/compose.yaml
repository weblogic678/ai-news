services:
  flowise:
    image: flowiseai/flowise:2.2.8@sha256:84e52b955e44303780f0b309d468d30e41c4866c4ceee3bc9215bfa645d3f6f5
    platform: linux/amd64
    restart: unless-stopped
    ports:
    - 127.0.0.1:3000:3000
    environment:
      PORT: '3000'
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:?Missing local username}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:?Missing local password}
      DISABLE_FLOWISE_TELEMETRY: 'true'
      DATABASE_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      SECRETKEY_PATH: /home/node/.flowise
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
    volumes:
    - app-data:/home/node/.flowise
    depends_on:
      init-data:
        condition: service_completed_successfully
  init-data:
    image: flowiseai/flowise:2.2.8@sha256:84e52b955e44303780f0b309d468d30e41c4866c4ceee3bc9215bfa645d3f6f5
    platform: linux/amd64
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - mkdir -p /home/node/.flowise; chown -R 1000:1000 /home/node/.flowise
    volumes:
    - app-data:/home/node/.flowise
    restart: 'no'
volumes:
  app-data: {}
