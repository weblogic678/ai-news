version: 0.7.0
kind: app
app:
  name: DeepSeek：三条摘要（需供应商凭据）
  description: 先安装官方 DeepSeek 插件并配置自己的凭据，再导入与测试。
  mode: workflow
  icon: 🧩
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 50
        y: 150
      positionAbsolute:
        x: 50
        y: 150
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 输入文本
        desc: ''
        selected: false
        variables:
        - variable: text
          label: 文本
          type: paragraph
          required: true
          max_length: 1000
          options: []
    - id: format
      type: custom
      position:
        x: 350
        y: 150
      positionAbsolute:
        x: 350
        y: 150
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: DeepSeek 摘要
        desc: ''
        selected: false
        context:
          enabled: false
          variable_selector: []
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-flash
          mode: chat
          completion_params: {}
        prompt_template:
        - id: system-prompt
          role: system
          text: 将输入整理为三条中文要点，保留事实，不补充猜测。
        - id: user-prompt
          role: user
          text: '{{#start.text#}}'
        vision:
          enabled: false
    - id: end
      type: custom
      position:
        x: 650
        y: 150
      positionAbsolute:
        x: 650
        y: 150
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 输出请求
        desc: ''
        selected: false
        outputs:
        - variable: result
          value_selector:
          - format
          - text
          value_type: string
    edges:
    - id: start-format
      type: custom
      source: start
      target: format
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
    - id: format-end
      type: custom
      source: format
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8
