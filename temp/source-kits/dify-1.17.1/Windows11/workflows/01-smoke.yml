version: 0.7.0
kind: app
app:
  name: 安装验收：摘要请求生成器
  description: 无需模型费用：输入文本→模板整理→输出。安装验收通过后可替换为 LLM 摘要。
  mode: workflow
  icon: 🧩
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 50
        y: 150
      positionAbsolute:
        x: 50
        y: 150
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 输入文本
        desc: ''
        selected: false
        variables:
        - variable: text
          label: 文本
          type: paragraph
          required: true
          max_length: 1000
          options: []
    - id: format
      type: custom
      position:
        x: 350
        y: 150
      positionAbsolute:
        x: 350
        y: 150
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: template-transform
        title: 生成摘要请求
        desc: ''
        selected: false
        variables:
        - variable: text
          value_selector:
          - start
          - text
          value_type: string
        template: '请将以下内容整理为三条中文要点：

          {{ text }}'
    - id: end
      type: custom
      position:
        x: 650
        y: 150
      positionAbsolute:
        x: 650
        y: 150
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 输出请求
        desc: ''
        selected: false
        outputs:
        - variable: result
          value_selector:
          - format
          - output
          value_type: string
    edges:
    - id: start-format
      type: custom
      source: start
      target: format
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: template-transform
        isInIteration: false
    - id: format-end
      type: custom
      source: format
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: template-transform
        targetType: end
        isInIteration: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8
