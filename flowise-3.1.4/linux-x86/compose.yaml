services:
  flowise:
    image: flowiseai/flowise:3.1.4@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    platform: linux/amd64
    restart: unless-stopped
    ports:
    - 127.0.0.1:3000:3000
    environment:
      PORT: '3000'
      DATABASE_PATH: /home/node/.flowise
      LOG_PATH: /home/node/.flowise/logs
      SECRETKEY_PATH: /home/node/.flowise
      BLOB_STORAGE_PATH: /home/node/.flowise/storage
    volumes:
    - app-data:/home/node/.flowise
    depends_on:
      init-data:
        condition: service_completed_successfully
  init-data:
    image: flowiseai/flowise:3.1.4@sha256:3922767afb52a5777759fd8b28a3c9eee864daea96018a791f2429eae2a76571
    platform: linux/amd64
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    - mkdir -p /home/node/.flowise; chown -R 1000:1000 /home/node/.flowise
    volumes:
    - app-data:/home/node/.flowise
    restart: 'no'
volumes:
  app-data: {}
